name: Build & Push Backend Services

on:
  push:
    branches:
      - main
    # Only trigger rebuilds if backend services change
    paths:
      - 'backend/auth_service/**'
      - 'backend/comments_service/**'
      - 'backend/friends_service/**'
      - 'backend/image_service/**'
      - 'backend/posts_service/**'
      - 'backend/profiles_service/**'
      - 'backend/redirect_service/**'
      - 'backend/tasks_service/**'
      - 'backend/users_service/**'
env:
  TENANT_ID: ${{ secrets.TENANT_ID }}
  CLIENT_ID: ${{ secrets.CLIENT_ID }}
  SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
  ACR_NAME: ${{ vars.ACR_NAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Auth Service
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'auth_service') || github.event.commits.*.modified.* contains 'backend/auth_service/') }}
        run: |
          docker build -f backend/auth_service/Dockerfile \
                       -t ${{ env.ACR_NAME }}/auth-service:latest \
                       backend/auth_service
          docker push ${{ env.ACR_NAME }}/auth-service:latest

      - name: Build and Push Comments Service
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'comments_service') || github.event.commits.*.modified.* contains 'backend/comments_service/') }}
        run: |
          docker build -f backend/comments_service/Dockerfile \
                       -t ${{ env.ACR_NAME }}/comments-service:latest \
                       backend/comments_service
          docker push ${{ env.ACR_NAME }}/comments-service:latest

      - name: Build and Push Friends Service
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'friends_service') || github.event.commits.*.modified.* contains 'backend/friends_service/') }}
        run: |
          docker build -f backend/friends_service/Dockerfile \
                       -t ${{ env.ACR_NAME }}/friends-service:latest \
                       backend/friends_service
          docker push ${{ env.ACR_NAME }}/friends-service:latest

      - name: Build and Push Image Service
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'image_service') || github.event.commits.*.modified.* contains 'backend/image_service/') }}
        run: |
          docker build -f backend/image_service/Dockerfile \
                       -t ${{ env.ACR_NAME }}/image-service:latest \
                       backend/image_service
          docker push ${{ env.ACR_NAME }}/image-service:latest

      - name: Build and Push Posts Service
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'posts_service') || github.event.commits.*.modified.* contains 'backend/posts_service/') }}
        run: |
          docker build -f backend/posts_service/Dockerfile \
                       -t ${{ env.ACR_NAME }}/posts-service:latest \
                       backend/posts_service
          docker push ${{ env.ACR_NAME }}/posts-service:latest

      - name: Build and Push Profiles Service
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'profiles_service') || github.event.commits.*.modified.* contains 'backend/profiles_service/') }}
        run: |
          docker build -f backend/profiles_service/Dockerfile \
                       -t ${{ env.ACR_NAME }}/profiles-service:latest \
                       backend/profiles_service
          docker push ${{ env.ACR_NAME }}/profiles-service:latest

      - name: Build and Push Redirect Service
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'redirect_service') || github.event.commits.*.modified.* contains 'backend/redirect_service/') }}
        run: |
          docker build -f backend/redirect_service/Dockerfile \
                       -t ${{ env.ACR_NAME }}/redirect-service:latest \
                       backend/redirect_service
          docker push ${{ env.ACR_NAME }}/redirect-service:latest

      - name: Build and Push Tasks Service
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'tasks_service') || github.event.commits.*.modified.* contains 'backend/tasks_service/') }}
        run: |
          docker build -f backend/tasks_service/Dockerfile \
                       -t ${{ env.ACR_NAME }}/tasks-service:latest \
                       backend/tasks_service
          docker push ${{ env.ACR_NAME }}/tasks-service:latest
          
      - name: Build and Push Users Service
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, 'users_service') || github.event.commits.*.modified.* contains 'backend/users_service/') }}
        run: |
          docker build -f backend/users_service/Dockerfile \
                       -t ${{ env.ACR_NAME }}/users-service:latest \
                       backend/users_service
          docker push ${{ env.ACR_NAME }}/users-service:latest
