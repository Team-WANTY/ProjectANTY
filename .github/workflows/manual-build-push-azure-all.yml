name: Build & Push All Backend Services Manually

on:
  workflow_dispatch:  # manual trigger

jobs:
  build-and-push-all:
    runs-on: ubuntu-latest
    environment: "Azure Deployment Environment"
    permissions:
      id-token: write
      contents: read

    strategy:
      matrix:
        service: [
          "auth-service",
          "comments-service",
          "friends-service",
          "image-service",
          "posts-service",
          "profiles-service",
          "redirect-service",
          "tasks-service",
          "users-service"
        ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Scale Down Service to Zero Replicas
        run: |
          az containerapp scale \
            --name ${{ matrix.service }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --min-replicas 0 --max-replicas 0

      - name: Build and Push ${{ matrix.service }} Service
        run: |
          docker build -f backend/${{ matrix.service }}/Dockerfile \
            -t ${{ vars.ACR_URL }}/${{ matrix.service }}:latest \
            backend
          docker push ${{ vars.ACR_URL }}/${{ matrix.service }}:latest

      - name: Deploy ${{ matrix.service }} Container App
        run: |
          az containerapp update \
            --name ${{ matrix.service }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_URL }}/${{ matrix.service }}:latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --min-replicas 1 \
            --max-replicas 3

      - name: Scale Up ${{ matrix.service }} to 1 Replica
        run: |
          az containerapp scale \
            --name ${{ matrix.service }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --min-replicas 1 --max-replicas 3
