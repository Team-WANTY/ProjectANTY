name: Build & Push All Backend Services Manually

on:
  workflow_dispatch:  # manual trigger

jobs:
  build-and-push-all:
    runs-on: ubuntu-latest
    environment: "Azure Deployment Environment"
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and Push Auth Service
        run: |
          docker build -f backend/auth_service/Dockerfile \
            -t ${{ vars.ACR_URL }}/auth-service:latest \
            backend
          docker push ${{ vars.ACR_URL }}/auth-service:latest

      - name: Deploy to Auth Container App
        run: |
          az containerapp update \
            --name auth-service \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_URL }}/auth-service:latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --min-replicas 1 \
            --max-replicas 3

      - name: Build and Push Comments Service
        run: |
          docker build -f backend/comments_service/Dockerfile \
            -t ${{ vars.ACR_URL }}/comments-service:latest \
            backend
          docker push ${{ vars.ACR_URL }}/comments-service:latest

      - name: Deploy to Comments Container App
        run: |
          az containerapp update \
            --name comments-service \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_URL }}/comments-service:latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --min-replicas 1 \
            --max-replicas 3

      - name: Build and Push Friends Service
        run: |
          run: |
          docker build -f backend/friends_service/Dockerfile \
            -t ${{ vars.ACR_URL }}/friends-service:latest \
            backend
          docker push ${{ vars.ACR_URL }}/friends-service:latest

      - name: Deploy to Friends Container App
        run: |
          az containerapp update \
            --name friends-service \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_URL }}/friends-service:latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --min-replicas 1 \
            --max-replicas 3

      - name: Build and Push Image Service
        run: |
          docker build -f backend/image_service/Dockerfile \
            -t ${{ vars.ACR_URL }}/image-service:latest \
            backend
          docker push ${{ vars.ACR_URL }}/image-service:latest

      - name: Deploy to Image Container App
        run: |
          az containerapp update \
            --name image-service \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_URL }}/image-service:latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --min-replicas 1 \
            --max-replicas 3

      - name: Build and Push Posts Service
        run: |
          docker build -f backend/posts_service/Dockerfile \
            -t ${{ vars.ACR_URL }}/posts-service:latest \
            backend
          docker push ${{ vars.ACR_URL }}/posts-service:latest

      - name: Deploy to Posts Container App
        run: |
          az containerapp update \
            --name posts-service \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_URL }}/posts-service:latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --min-replicas 1 \
            --max-replicas 3

      - name: Build and Push Profiles Service
        run: |
          docker build -f backend/profiles_service/Dockerfile \
            -t ${{ vars.ACR_URL }}/profiles-service:latest \
            backend
          docker push ${{ vars.ACR_URL }}/profiles-service:latest

      - name: Deploy to Profiles Container App
        run: |
          az containerapp update \
            --name profiles-service \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_URL }}/profiles-service:latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --min-replicas 1 \
            --max-replicas 3

      - name: Build and Push Redirect Service
        run: |
          docker build -f backend/redirect_service/Dockerfile \
            -t ${{ vars.ACR_URL }}/redirect-service:latest \
            backend
          docker push ${{ vars.ACR_URL }}/redirect-service:latest

      - name: Deploy to Redirect Container App
        run: |
          az containerapp update \
            --name redirect-service \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_URL }}/redirect-service:latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --min-replicas 1 \
            --max-replicas 3

      - name: Build and Push Tasks Service
        run: |
          docker build -f backend/tasks_service/Dockerfile \
            -t ${{ vars.ACR_URL }}/tasks-service:latest \
            backend
          docker push ${{ vars.ACR_URL }}/tasks-service:latest

      - name: Deploy to Tasks Container App
        run: |
          az containerapp update \
            --name tasks-service \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_URL }}/tasks-service:latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --min-replicas 1 \
            --max-replicas 3
          
      - name: Build and Push Users Service
        run: |
          docker build -f backend/users_service/Dockerfile \
            -t ${{ vars.ACR_URL }}/users-service:latest \
            backend
          docker push ${{ vars.ACR_URL }}/users-service:latest

      - name: Deploy to Users Container App
        run: |
          az containerapp update \
            --name users-service \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_URL }}/users-service:latest \
            --cpu 0.25 \
            --memory 0.5Gi \
            --min-replicas 1 \
            --max-replicas 3
