name: Hello Backend Pipelines

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Make sure code abides by the ruff format.
  auth-backend:
    name: Lint, Typecheck.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code.
        uses: actions/checkout@v2
    
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Hello world - run format and typecheck.
        run: |
          cd backend/hello-world ; uv sync --dev ; uv run ruff check ; uv run ty check
