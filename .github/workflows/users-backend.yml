name: Hello Backend Pipelines

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Make sure code abides by the ruff format.
  auth-backend:
    name: Lint, Typecheck.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code.
        uses: actions/checkout@v2
    
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Users - run format and typecheck.
        env:
          COSMOSDB_ENDPOINT: ${{ secrets.COSMOSDB_ENDPOINT }}
          COSMOSDB_KEY: ${{ secrets.COSMOSDB_KEY }}
          COSMOSDB_DATABASE_NAME: ${{ secrets.COSMOSDB_DATABASE_NAME }}
          COSMOSDB_USER_CONTAINER_NAME: ${{ secrets.COSMOSDB_USER_CONTAINER_NAME }}
          
          INTERSERVICE_KEY: ${{ secrets.INTERSERVICE_KEY }}

          TOKEN_ALGORITHM: ${{ secrets.TOKEN_ALGORITHM }}
          ACCESS_TOKEN_EXPIRATION_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRATION_MINUTES }}
          REFRESH_TOKEN_EXPIRATION_DAYS: ${{ secrets.REFRESH_TOKEN_EXPIRATION_DAYS }}
        run: |
          cd backend/users_service
          uv sync --dev && uv pip install -e ../shared
          uv run ruff check
          uv run ty check
          uv run pytest
