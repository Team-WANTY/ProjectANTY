[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shared"
version = "0.1.0"
description = "Shared models and utilities for microservices."
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.119.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.11.0",
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
include = ["*.py"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.14.0",
    "ty>=0.0.1a21",
]

[tool.ty.src]
include = ["*.py", "models", "exceptions"]
exclude = ["venv", ".venv"]

[tool.ty.terminal]
output-format = "full"
error-on-warning = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # allow raising exceptions without 'from e'
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true


[tool.pytest.ini_options]
addopts = "-p no:warnings"
pythonpath = "../"
python_files = "test_*.py"
testpaths = [
    "tests",
]

[tool.pytest_env]
AUTH_EXTERNAL_URL="http://external-service"
AUTH_SERVICE_URL="http://auth-service:8000"
USERS_SERVICE_URL="http://users-service:8000"
PROFILES_SERVICE_URL="http://profiles-service:8000"
POSTS_SERVICE_URL="http://posts-service:8000"
FRIENDS_SERVICE_URL="http://friends-service:8000"
INTERSERVICE_KEY="supersecret"
COSMOSDB_ENDPOINT="https://localhost:8081"
COSMOSDB_KEY="fake-key"
COSMOSDB_DATABASE_NAME="testdb"
MINIMUM_LOGGING_LEVEL="debug"