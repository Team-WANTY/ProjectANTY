<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Doc Navigator</title>
    <style>
        select {
            padding: 10px;
            margin:auto;
            display:block;
            font-size: 16px;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <select id="service-dropdown" onchange="changeDocs()">
        <option value="auth">Auth Service</option>
        <option value="friends">Friends Service</option>
        <option value="images">Images Service</option>
        <option value="profiles">Profiles Service</option>
        <option value="redirect">Redirect Service</option>
        <option value="tasks">Tasks Service</option>
        <option value="users">Users Service</option>
    </select>

    <!-- Iframe to load the docs -->
    <iframe id="docs-iframe" src="http://localhost/users/docs" title="API Documentation"></iframe>

    <script>
        function changeDocs() {
            var selectedService = document.getElementById("service-dropdown").value;
            var iframe = document.getElementById("docs-iframe");
            iframe.src = "http://localhost/"+selectedService+"/docs"
        }
    </script>

</body>
</html>
