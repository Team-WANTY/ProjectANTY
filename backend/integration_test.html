    async function loginUser(username, password){
        const url = 'http://localhost/auth/login';
        const headers = {
            'Accept': 'application/json',
            'Content-Type': 'application/x-www-form-urlencoded'
            
        };
        const body = new URLSearchParams({
            grant_type: 'password',
            username: username,  // Replace with actual username
            password: password   // Replace with actual password
        }).toString();
        const response = await fetch(url, {method:"POST", headers:headers, body:body,credentials: "include"});
        if (response.status === 200){
            const responseData = await response.json();
            if (responseData.token_type === "bearer"){
                return responseData.access_token;
            }
        }
    }

    function logResult(step, success) {
        const resultsDiv = document.getElementById("test-results");
        const resultElem = document.createElement("div");
        resultElem.classList.add("test-step");
        resultElem.innerHTML = `${step}: <span class="status ${success ? '' : 'failed'}">${success ? 'Success' : 'Failed'}</span>`;
        resultsDiv.appendChild(resultElem);
        resultElem.scrollIntoView();
    }

        const today = new Date();

        const taskData = {
            user_id: state.user1.id,

                duration: { specifier: "until_date", value: futureDateStr }
            }
        };
        const headers = {

            }
