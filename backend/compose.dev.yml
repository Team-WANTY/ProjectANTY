services:
  traefik:
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.filename=/traefik/traefik.dev.yml"
    volumes:
      - "./certs:/certs:ro"
      - "./traefik/traefik.dev.yml:/traefik/traefik.dev.yml:ro"
