[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comments_service"
version = "0.1.0"
description = "FastAPI microservice for social comment features."
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard]>=0.119.0",
    "aiohttp>=3.13.0",
    "azure-cosmos>=4.14.0",
    "shared"
]

[tool.uv.sources]
"shared" = { path = "../shared", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-subtests>=0.14.2",
    "pytest-env>=1.2.0",
    "ruff>=0.14.0",
    "ty>=0.0.1a21",
]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["venv", ".venv"]

[tool.ty.environment]
extra-paths = ["../"]

[tool.ty.terminal]
output-format = "full"
error-on-warning = true 

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # allow raising exceptions without 'from e' for HTTPException
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true


[tool.pytest.ini_options]
addopts = "-p no:warnings"
pythonpath = "../"
python_files = "test_*.py"
testpaths = [
    "tests",
]

[tool.pytest_env]
AUTH_SERVICE_URL="http://localhost:8000"
AUTH_EXTERNAL_URL="http://external-service"
USERS_SERVICE_URL="http://localhost:8000"
INTERSERVICE_KEY="supersecret"
COSMOSDB_ENDPOINT="https://localhost:8081"
COSMOSDB_KEY="fake-key"
COSMOSDB_DATABASE_NAME="testdb"
MINIMUM_LOGGING_LEVEL="debug"