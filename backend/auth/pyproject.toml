[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auth_service"
version = "0.1.0"
description = "FastAPI microservice for user authentication."
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiohttp>=3.13.0,<4.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "azure-cosmos>=4.9.0,<5.0.0",
    "cryptography>=46.0.2,<48.0.0",
    "fastapi[standard]>=0.118.2,<1.0.0",
    "httpx>=0.28.1,<0.32.0",
    "passlib[argon2]>=1.7.4,<2.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.11.0,<3.0.0",
    "pydantic[email]>=2.12.0,<3.0.0",
    "pyjwt[cryptography]>=2.10.1,<3.0.0",
    "python-dotenv>=1.1.1,<3.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "uvicorn[standard]>=0.37.0,<0.50.0",
]

[tool.hatch.build.targets.wheel]
packages = ["service"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-subtests>=0.14.2",
    "ruff>=0.14.0",
    "ty>=0.0.1a21",
]

[tool.ty.src]
include = ["service", "tests"]
exclude = ["venv", ".venv"]

[tool.ty.terminal]
output-format = "full"
error-on-warning = true 

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # allow raising exceptions without 'from e' for HTTPException
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
